docker:
  name: Build and Scan Docker Image
  runs-on: ubuntu-latest
  needs: test

  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker image
      run: docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/url-shortener:v1.0" -t "${{ secrets.DOCKERHUB_USERNAME }}/url-shortener:latest" .

    - name: Scan image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/url-shortener:v1.0
        format: table
        exit-code: 1
        ignore-unfixed: true
        severity: CRITICAL,HIGH

    - name: Push v1.0
      run: docker push "${{ secrets.DOCKERHUB_USERNAME }}/url-shortener:v1.0"

    - name: Push latest
      run: docker push "${{ secrets.DOCKERHUB_USERNAME }}/url-shortener:latest"
